<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Admin – E-commerce Demo</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div><strong>Admin Panel</strong></div>
    <div>
      <a href="index.html">User Site</a>
      <a href="login.html">Login</a>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <h2>Add Product</h2>
      <form id="productForm">
        <input type="text" id="pName" placeholder="Product name" required>
        <input type="number" id="pPrice" placeholder="Price" required>
        <input type="text" id="pImage" placeholder="Image URL (optional)">
        <textarea id="pDesc" placeholder="Description"></textarea>
        <button class="btn" type="submit">Add Product</button>
      </form>
    </div>

    <div class="card">
      <h2>All Products</h2>
      <div id="adminProducts"></div>
    </div>

    <div class="card">
      <h2>All Orders</h2>
      <div id="adminOrders"></div>
    </div>
  </main>

  <script src="js/admin.js"></script>
</body>
</html>
